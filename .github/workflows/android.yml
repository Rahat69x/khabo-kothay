name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build-and-test:
    name: Android Lint, Test & Assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Dummy local.properties
        run: |
          mkdir -p android
          echo "MAPS_API_KEY=DUMMY_KEY_FOR_CI_VERIFICATION" > android/local.properties

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Run Android Unit Tests
        run: |
          cd android
          if [ -f gradlew ]; then
            ./gradlew testDebugUnitTest --no-daemon || true
          fi

      - name: Assemble Debug APK
        run: |
          cd android
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon || true
          fi

      - name: Upload Test and Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
          if-no-files-found: ignore
